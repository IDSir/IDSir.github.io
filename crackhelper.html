<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协议破译助手</title>
    <style>
         :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
            --banner-bg: rgba(56, 189, 248, 0.15);
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            position: relative;
        }
        /* Console Banner */
        
        .console-banner {
            background: var(--banner-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--accent-color);
            gap: 10px;
        }
        
        .banner-text {
            font-weight: 500;
            line-height: 1.4;
            flex: 1;
        }
        
        .btn-copy-script {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        
        .btn-copy-script:hover {
            opacity: 0.9;
        }
        /* Header */
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--accent-color);
        }
        
        .icon-btn {
            background: #334155;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            transition: background 0.2s, color 0.2s;
        }
        
        .icon-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #0f172a;
        }
        
        .lang-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        select.lang-select {
            background: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
        }
        
        select.lang-select option {
            color: #000000;
            background-color: #ffffff;
        }
        
        .credits {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: left;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            line-height: 1.6;
        }
        /* Config Panel */
        
        #config-panel {
            display: none;
            margin-bottom: 20px;
            background: #111827;
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 20px;
        }
        
        .config-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        
        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .config-row input {
            background: #1e293b;
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .input-cat-name {
            flex: 2;
        }
        
        .input-cat-vals {
            flex: 4;
        }
        
        .btn-del {
            background: var(--error);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn-add {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        .config-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border);
        }
        /* Stats & Game UI */
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 24px;
            background: rgba(15, 23, 42, 0.6);
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #334155;
            padding-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        
        .stat-item:nth-last-child(-n+2) {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .stat-item b {
            color: var(--accent-color);
            font-size: 1rem;
        }
        
        .suggestion-box {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            position: relative;
        }
        
        .suggestion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .suggestion-title {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .btn-copy-seq {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 6px 12px;
            gap: 5px;
            background: var(--accent-color);
            color: #0f172a;
        }
        
        .btn-copy-seq:hover:not(:disabled) {
            background: #7dd3fc;
            color: #0f172a;
        }
        
        .btn-copy-seq span {
            margin-top: 1px;
        }
        
        .suggestion-value {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            letter-spacing: 1px;
            word-break: break-all;
            color: var(--text-main);
            padding: 5px 0;
        }
        
        .copy-toast {
            position: absolute;
            top: -30px;
            right: 10px;
            background: var(--success);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
        }
        
        button.main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.1s, opacity 0.2s;
        }
        
        button.main-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background-color: var(--accent-color);
            color: #0f172a;
            margin-bottom: 12px;
        }
        
        .btn-save {
            background-color: var(--success);
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        
        .btn-group-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .btn-group-row button {
            margin-bottom: 0;
        }
        
        .history {
            margin-top: 20px;
            font-size: 0.8rem;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        
        .log-entry {
            margin-bottom: 6px;
            color: var(--text-dim);
            font-family: monospace;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }
        
        .success-msg {
            color: var(--success);
            text-align: center;
            font-weight: bold;
            padding: 15px;
            border: 2px solid var(--success);
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.1);
        }
        
        .error-msg {
            color: var(--error);
            text-align: center;
            font-weight: bold;
            padding: 15px;
        }
        
        .footer-links {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--border);
            font-size: 0.85rem;
            line-height: 1.8;
        }
        
        .footer-links a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s;
            display: block;
        }
        
        .footer-links a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
        
        svg {
            fill: currentColor;
        }
    </style>
</head>

<body>

    <div class="container">

            detecting: "📋 System parameters detected:",
            ready: "📡 Decryption logic ready, engaging...",
            step: "Step",

            feedback: "Feedback: Mismatched count =",

            gameEnd: "Game Over: Dialog closed.",
            perfect: "Perfect Match!",

        },
        ru: {
            online: "📡 Система дешифрования активирована (Задержка усилена)",
            detecting: "📋 Обнаружены системные параметры:",
            ready: "📡 Логика дешифрования готова, запуск...",
            step: "Шаг",
            attempt: "Пробуем",
            feedback: "Результат: Несоответствий =",
            success: "🎉 Протокол успешно взломан!",
            waiting: "⏳ Ожидание ответа Mismatched...",
            timeout: "❌ Тайм-аут: не удалось получить данные из логов.",
            conflict: "❌ Логическая ошибка: подходящих вариантов не найдено.",
            gameEnd: "Игра окончена: Диалоговое окно закрыто.",
            perfect: "Идеальное совпадение!",

    const browserLang = navigator.language.split('-')[0];
    const t = i18n[browserLang] || i18n['en'];

    const sleep = (ms) => new Promise(res => setTimeout(res, ms));

    async function typeValue(inputEl, value) {
        if (!document.contains(inputEl)) return false;
        const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
        setter.call(inputEl, value);
        inputEl.dispatchEvent(new Event("input", { bubbles: true }));
        inputEl.dispatchEvent(new Event("change", { bubbles: true }));
        await sleep(200);
        ["keydown", "keypress", "keyup"].forEach(type => 
            inputEl.dispatchEvent(new KeyboardEvent(type, { key: "Enter", code: "Enter", keyCode: 13, bubbles: true }))
        );
        await sleep(300);
        return true;
    }

    function getLogs() {
        const container = document.querySelector('[data-sentry-element="LogContentStyled"]');
        return [...container?.querySelectorAll("div") ?? []].map(e => e.textContent.trim()).filter(Boolean);
    }

    const countMismatches = (g, t) => g.reduce((acc, val, i) => acc + (val !== t[i] ? 1 : 0), 0);
    function findBestGuess(possibles, allCodes) {
        if (possibles.length === 1) return possibles[0];
        let best = null, maxEntropy = -1;
        let searchSet = allCodes.length > 500 ? possibles : allCodes;
        for (const candidate of searchSet) {
            let counts = {};
            for (const p of possibles) {
                let m = countMismatches(candidate, p);
                counts[m] = (counts[m] || 0) + 1;
            }
            let entropy = 0;
            for (let m in counts) {
                let p = counts[m] / possibles.length;
                entropy -= p * Math.log2(p);
            }
            if (entropy > maxEntropy) { maxEntropy = entropy; best = candidate; }
        }
        return best;
    }

    const initialLogs = getLogs();
    const fieldOptions = initialLogs.filter(t => t.includes("→")).map(t => t.match(/→\\s*(.+)/)[1].split("/").map(v => v.trim()));

    if (fieldOptions.length === 0) return console.error(t.errNoParam);

    console.log("%c" + t.detecting, "color: #38bdf8; font-weight: bold", fieldOptions);

    const allPossibilities = fieldOptions.reduce((a, b) => a.flatMap(d => b.map(e => [d, e].flat())));
    let possibles = [...allPossibilities];
    const inputField = document.querySelector('input[placeholder="' + fieldOptions.map(f => f[0]).join(" ") + '"]');

    if (!inputField) return console.error(t.errNoInput);

    console.log("%c" + t.online, "color: #38bdf8; font-weight: bold");

    let attempt = 1;
    while (possibles.length > 0) {
        if (!document.contains(inputField)) { alert(t.gameEnd); break; }

        const guess = findBestGuess(possibles, allPossibilities);
        const guessStr = guess.join(" ");
        const logLenBefore = getLogs().length;

        console.log("%c[" + t.step + " " + attempt + "] %c" + t.attempt + ": " + guessStr, "color: #94a3b8", "color: #38bdf8; font-weight: bold");
        const success = await typeValue(inputField, guessStr);

        if (!success || !document.contains(inputField)) {
            console.log("%c" + t.success, "color: #22c55e; font-weight: bold");
            alert(t.success);
            break;
        }

        let m = null;
        for (let i = 0; i < 60; i++) {
            await sleep(100);
            if (!document.contains(inputField)) { alert(t.success); return; }

            let currentLogs = getLogs();
            if (currentLogs.length > logLenBefore) {
                await sleep(300);
                const latestLines = getLogs().slice(logLenBefore);
                for (const line of latestLines) {
                    const match = line.match(/Mismatched.*?(\\d+)/i);
                    if (match) { m = parseInt(match[1]); break; }
                }
            }
            if (m !== null) break;
        }

        if (m !== null) {
            console.log("%c" + t.feedback + " " + m, "color: #fbbf24; font-weight: bold");
            if (m === 0) { alert(t.perfect); break; }
            possibles = possibles.filter(p => countMismatches(guess, p) === m);
        } else {
            console.warn(t.timeout);
            break;
        }
        attempt++;
    }
})();`;

        let CONFIG_DATA = [{
            name: "VERSIONS",
            vals: "v1.0, v1.1, v2.0"
        }, {
            name: "METHODS",
            vals: "GET, PUT, POST"
        }, {
            name: "CHANNELS",
            vals: "LTE, Sat, Fiber"
        }, {
            name: "CIPHERS",
            vals: "AES, RSA, DES"
        }];

        let MAX_ATTEMPTS = 5;
        let currentLang = 'zh';
        let allCodes = [];
        let possibles = [];
        let attemptNum = 1;
        let currentSuggested = null;
        let currentMaxScore = 0;
        let historyStack = [];

        function detectLanguage() {
            const lang = navigator.language.toLowerCase();
            if (lang.startsWith('en')) return 'en';
            if (lang.startsWith('ru')) return 'ru';
            return 'zh';
        }

        function toggleConfig() {
            const p = document.getElementById('config-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function addRow(name = "", vals = "") {
            const container = document.getElementById('config-rows-container');
            const div = document.createElement('div');
            div.className = 'config-row';
            div.innerHTML = `
            <input type="text" class="input-cat-name" placeholder="${i18n[currentLang].rowName}" value="${name}">
            <input type="text" class="input-cat-vals" placeholder="${i18n[currentLang].rowVals}" value="${vals}">
            <button class="btn-del" onclick="this.parentElement.remove(); updateMeta();">×</button>
        `;
            container.appendChild(div);
            updateMeta();
        }

        function updateMeta() {
            const rows = document.querySelectorAll('.config-row');
            document.getElementById('disp-total-params').value = rows.length;
            document.getElementById('inp-max-attempts').value = rows.length + 1;
        }

        function applyConfig() {
            const rows = document.querySelectorAll('.config-row');
            CONFIG_DATA = Array.from(rows).map(row => ({
                name: row.querySelector('.input-cat-name').value,
                vals: row.querySelector('.input-cat-vals').value
            }));
            MAX_ATTEMPTS = parseInt(document.getElementById('inp-max-attempts').value);
            toggleConfig();
            resetGame();
        }

        function changeLang(lang) {
            currentLang = lang;
            const d = i18n[lang];
            document.title = d.title;
            document.getElementById('ui-title').innerText = d.title;
            document.getElementById('ui-credits').innerText = d.credits;
            document.getElementById('ui-cfg-list').innerText = d.cfgList;
            document.getElementById('ui-cfg-add').innerText = d.cfgAdd;
            document.getElementById('ui-cfg-attempts').innerText = d.cfgAttempts;
            document.getElementById('ui-cfg-parmas').innerText = d.cfgParmas;
            document.getElementById('ui-save').innerText = d.save;
            document.getElementById('ui-st-attempt').innerText = d.stAttempt;
            document.getElementById('ui-st-params').innerText = d.stParams;
            document.getElementById('ui-st-poss').innerText = d.stPoss;
            document.getElementById('ui-st-entropy').innerText = d.stEntropy;

            // Suggested text logic (requires state knowledge)
            const isLast = (possibles && possibles.length === 1);
            document.getElementById('ui-suggested').innerText = isLast ? d.lastOne : d.suggested;

            // Copy button with space key hint
            document.getElementById('ui-copy-space-text').innerText = d.copySpace;

            document.getElementById('ui-input-label').innerText = d.inputLabel;
            document.getElementById('ui-submit').innerText = d.submit;
            document.getElementById('ui-undo').innerText = d.undo;
            document.getElementById('ui-reset').innerText = d.reset;
            document.getElementById('copy-toast').innerText = d.copyOk;

            document.getElementById('ui-banner-text').innerText = d.bannerText;
            document.getElementById('ui-banner-btn').innerText = d.bannerBtn;

            document.querySelectorAll('.input-cat-name').forEach(i => i.placeholder = d.rowName);
            document.querySelectorAll('.input-cat-vals').forEach(i => i.placeholder = d.rowVals);
            updateDisplay();
        }

        function copyConsoleScript() {
            navigator.clipboard.writeText(CONSOLE_SCRIPT).then(() => {
                alert(i18n[currentLang].copyHint);
            });
        }

        function copySequence() {
            const text = document.getElementById('best-guess-display').innerText;
            if (text === "---" || text === "") return;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 1500);
            });
        }

        function cartesianProduct(arrays) {
            if (arrays.length === 0) return [];
            return arrays.reduce((a, b) => a.flatMap(d => b.map(e => [d, e].flat())));
        }

        function countMismatches(g, c) {
            return g.reduce((acc, val, i) => acc + (val !== c[i] ? 1 : 0), 0);
        }

        function calculateEntropy(guess, currentPossibles) {
            let counts = {};
            currentPossibles.forEach(p => {
                let m = countMismatches(guess, p);
                counts[m] = (counts[m] || 0) + 1;
            });
            let entropy = 0;
            let total = currentPossibles.length;
            for (let m in counts) {
                let p = counts[m] / total;
                entropy -= p * Math.log2(p);
            }
            return entropy;
        }

        function findBestGuess() {
            if (possibles.length === 0) return {
                code: null,
                entropy: 0
            };
            if (possibles.length === 1) return {
                code: possibles[0],
                entropy: 0
            };
            let best = null;
            let maxScore = [-1, 0];
            let searchSet = allCodes.length > 500 ? possibles : allCodes;
            for (let candidate of searchSet) {
                let entropy = calculateEntropy(candidate, possibles);
                let inPossibles = possibles.includes(candidate) ? 1 : 0;
                if (entropy > maxScore[0] || (entropy === maxScore[0] && inPossibles > maxScore[1])) {
                    maxScore = [entropy, inPossibles];
                    best = candidate;
                }
            }
            return {
                code: best,
                entropy: maxScore[0]
            };
        }

        function updateDisplay() {
            document.getElementById('attempt-count').innerText = attemptNum;
            document.getElementById('max-attempts-display').innerText = MAX_ATTEMPTS;
            document.getElementById('total-params-display').innerText = CONFIG_DATA.length;
            document.getElementById('possibles-count').innerText = possibles.length;
            document.getElementById('entropy-display').innerText = currentMaxScore.toFixed(2);
            const uiSuggestTitle = document.getElementById('ui-suggested');
            uiSuggestTitle.innerText = possibles.length === 1 ? i18n[currentLang].lastOne : i18n[currentLang].suggested;
            document.getElementById('best-guess-display').innerText = currentSuggested ? currentSuggested.join(' ') : "---";
        }

        function saveState() {
            historyStack.push({
                possibles: [...possibles],
                attemptNum: attemptNum,
                currentSuggested: currentSuggested,
                currentMaxScore: currentMaxScore,
                logHTML: document.getElementById('history-log').innerHTML
            });
            document.getElementById('ui-undo').disabled = false;
        }

        function undoGuess() {
            if (historyStack.length === 0) return;
            const prevState = historyStack.pop();
            possibles = prevState.possibles;
            attemptNum = prevState.attemptNum;
            currentSuggested = prevState.currentSuggested;
            currentMaxScore = prevState.currentMaxScore;
            document.getElementById('history-log').innerHTML = prevState.logHTML;
            document.getElementById('status-area').innerHTML = "";
            document.getElementById('ui-submit').disabled = false;
            document.getElementById('mismatch-input').value = "";
            if (historyStack.length === 0) document.getElementById('ui-undo').disabled = true;
            updateDisplay();
        }

        function submitGuess() {
            if (!currentSuggested || possibles.length === 0) return;
            const val = document.getElementById('mismatch-input').value;
            const m = parseInt(val);
            if (isNaN(m) || m < 0 || m > CONFIG_DATA.length) return;
            saveState();
            if (m === 0) {
                document.getElementById('status-area').innerHTML = `<div class="success-msg">${i18n[currentLang].success}</div>`;
                document.getElementById('ui-submit').disabled = true;
                return;
            }
            const log = document.getElementById('history-log');
            log.innerHTML = `<div class="log-entry">#${attemptNum} ${currentSuggested.join(' ')} | Mismatch: ${m}</div>` + log.innerHTML;
            possibles = possibles.filter(code => countMismatches(currentSuggested, code) === m);
            if (possibles.length === 0) {
                document.getElementById('status-area').innerHTML = `<div class="error-msg">${i18n[currentLang].error}</div>`;
                return;
            }
            attemptNum++;
            if (attemptNum <= MAX_ATTEMPTS) {
                const res = findBestGuess();
                currentSuggested = res.code;
                currentMaxScore = res.entropy;
                updateDisplay();
            } else {
                document.getElementById('ui-submit').disabled = true;
            }
            document.getElementById('mismatch-input').value = "";
        }

        function resetGame() {
            const paramArrays = CONFIG_DATA.map(c => c.vals.split(',').map(v => v.trim()).filter(v => v !== ""));
            allCodes = cartesianProduct(paramArrays);
            possibles = [...allCodes];
            attemptNum = 1;
            historyStack = [];
            const res = findBestGuess();
            currentSuggested = res.code;
            currentMaxScore = res.entropy;
            document.getElementById('status-area').innerHTML = "";
            document.getElementById('history-log').innerHTML = "";
            document.getElementById('ui-submit').disabled = false;
            document.getElementById('ui-undo').disabled = true;
            document.getElementById('mismatch-input').value = "";
            updateDisplay();
        }

        document.addEventListener("DOMContentLoaded", () => {
            CONFIG_DATA.forEach(c => addRow(c.name, c.vals));
            const lang = detectLanguage();
            document.getElementById('lang-selector').value = lang;
            changeLang(lang);
            resetGame();

            // 监听回车键提交
            document.getElementById('mismatch-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitGuess();
                }
            });

            // 监听空格键复制
            document.addEventListener('keydown', function(e) {
                // 如果当前焦点在输入框中，不触发空格键复制，允许正常输入
                if (document.activeElement.tagName === 'INPUT') return;

                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault(); // 阻止页面滚动
                    copySequence();
                }
            });
        });
    </script>
